[versions]
# ⚠️ These versions were confirmed live against maven-metadata.xml on 2026-07-28.
# Before upgrading, read the "version compatibility" section of docs/stack.md — a few of these can't just be bumped to latest.

kotlin = "2.4.10"
# ⚠️ We originally wanted to pin AGP 9.1.0 to stay within Kotlin 2.4.x's officially tested range, but that
# turned out not to work in practice: the androidx ecosystem's minimum compileSdk is already 37
# (both lifecycle 2.11.0 and core 1.19.0 require it), while AGP 9.1.0 only supports up to 36.
# Staying pinned to 36 would mean downgrading a bunch of androidx libraries one by one.
# So we bumped to 9.3.1, at the cost of exceeding Kotlin's officially tested AGP ceiling. See docs/stack.md for details.
agp = "9.3.1"
# AGP 9.3 requires Gradle >= 9.5.0, which also happens to be Kotlin 2.4.x's tested ceiling
gradle = "9.5.0"

compose = "1.11.1"
# ⚠️ CMP's material3 follows its **own independent version line**, separate from the compose plugin version
# (when the plugin is 1.11.1, material3 is 1.9.0). Referencing material3 with the compose version number
# fails with "Could not find ...material3:1.11.1".
composeMaterial3 = "1.9.0"
lifecycle = "2.11.0"
navigation = "2.9.2"

coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

koin = "4.2.2"
sqldelight = "2.3.2"
datastore = "1.2.1"
ktor = "3.5.1"
vico = "3.2.3"

turbine = "1.2.1"
kotest = "6.2.3"

androidxActivity = "1.13.0"
# fragment is here for FragmentActivity — a hard requirement of BiometricPrompt's constructor
androidxFragment = "1.8.9"
androidxCore = "1.19.0"
# 1.1.0 dates back to 2021, but it's the only stable release. 1.4.0 is alpha-only,
# and we don't use alpha releases on a financial app's authentication path.
androidxBiometric = "1.1.0"

androidMinSdk = "26"
androidTargetSdk = "36"
androidCompileSdk = "37"
jvmTarget = "17"

[libraries]
# --- Compose ---
# Uses explicit coordinates instead of the compose.runtime / compose.material3 shorthand —
# the shorthand has been deprecated since CMP 1.11 ("Specify dependency directly").
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }

# --- Lifecycle / Navigation ---
# The lifecycle version bundled with CMP 1.11.1 is 2.11.0-beta01; this manually bumps it to stable 2.11.0
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- Coroutines / Serialization / Time ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# Only used for its LocalDate / TimeZone / formatting. Instant and Clock come from the kotlin.time standard library.
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# --- Dependency Injection ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# --- Local database ---
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# JVM/JDBC driver, used only for host tests — lets schema and CHECK constraints be verified against a real database
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

# --- Preferences ---
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

# --- Networking (quotes / FX rates) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Charting ---
# ⚠️ Vico 3.0.0 renamed the `multiplatform` module to `compose`, and removed the old Android-only
# `compose` module. So `:compose` is now the cross-platform one, and `:multiplatform` is the legacy 2.x line.
vico-compose = { module = "com.patrykandpatrick.vico:compose", version.ref = "vico" }
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# --- Android app entry point only (not part of shared/commonMain) ---
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }

# --- Testing ---
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# Assertions only, not Kotest's framework/plugin/KSP — the runner is still kotlin-test
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Deliberately no org.jetbrains.kotlin.android — AGP 9.0+ has built-in Kotlin support,
# and applying it fails the build outright. androidApp only needs androidApplication + composeCompiler.
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# ⚠️ Not com.android.library — AGP 9+ requires KMP modules to use this new plugin
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
# Deliberately not pulling in Mokkery: it's a compiler plugin whose compatibility table only lists up to
# Kotlin 2.4.0, while we're on 2.4.10. We hand-write fakes by default; consider Mockative (KSP-based,
# not pinned to a Kotlin version) if mocking becomes genuinely necessary.
