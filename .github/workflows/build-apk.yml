name: Build Android APK

# Only builds the Android half — the iOS target needs a real Xcode, which isn't fully set up
# on GitHub's free Linux/macOS runners; forcing it would only fail at the linking step (we made
# this exact mistake locally before, see AGENTS.md). `:androidApp:assembleDebug` doesn't trigger
# any iOS compile/link tasks, so the cheap and fast ubuntu-latest is enough — no macOS runner needed.

# Manual trigger only — doesn't run automatically on every push. Not every change needs a fresh
# debug APK; click "run" manually when one is actually needed. This saves Actions minutes, and
# keeps the "latest build" Release from churning with every small change.
on:
  workflow_dispatch: {}

# The default GITHUB_TOKEN is read-only — publishing a Release needs contents: write declared
# explicitly, otherwise the softprops/action-gh-release step reports a 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project is pinned to compileSdk 37 — the package name `platforms;android-37` doesn't
      # actually exist in the public sdkmanager repository (the first run failed outright with
      # "Failed to find package"), which shows that local builds work because AGP downloads SDK
      # components on demand itself, not because sdkmanager pre-installed them. Here we only
      # accept the license and don't specify a concrete package, leaving the download work to
      # Gradle/AGP at compile time.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: boomsset-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Rename with the short commit hash — if we just called it androidApp-debug.apk,
      # the file attached to the Release would always have the same name, with no way
      # to tell which build produced it.
      - name: Rename APK with commit SHA
        run: |
          mkdir -p release
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
             "release/boomsset-debug-${GITHUB_SHA::7}.apk"

      # A single rolling "debug-latest" Release that gets overwritten by every build, instead of
      # opening a new one each time — this is just a continuous debug build for my own testing,
      # not a versioned release, so piling up tags serves no purpose. To keep a historical build,
      # go dig it out of the Actions workflow artifacts (retained for 90 days).
      - name: Publish/update debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Debug build (${{ github.sha }})"
          body: |
            Automated build, not an official release. Corresponding commit: ${{ github.sha }}

            This Release is overwritten on every push to main — only the latest build is kept.
          prerelease: true
          files: release/*.apk
