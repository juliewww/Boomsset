org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Deliberately disabled: KMP + Kotlin/Native tasks have a long-standing compatibility issue with
# configuration cache (KT-44900), and neither side claims full support. This is the first suspect
# when a build fails in a weird way.
# Worth trying to turn on once the iOS pipeline stabilizes, but run the full allTests suite to verify.
org.gradle.configuration-cache=false

kotlin.daemon.jvmargs=-Xmx3072M

android.useAndroidX=true
