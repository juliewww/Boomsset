# XcodeGen project definition. Run `xcodegen generate` to produce iosApp.xcodeproj.
#
# Why XcodeGen instead of committing the .xcodeproj to the repo:
# AGENTS.md says .pbxproj files should "preferably not be hand-edited, conflicts are extremely
# hard to resolve." With a generator, **this YAML is what gets committed** (readable, reviewable,
# mergeable), and pbxproj becomes a build artifact that goes into .gitignore. That removes the
# root cause of that constraint.

name: iosApp
options:
  bundleIdPrefix: com.boomsset
  deploymentTarget:
    # Kotlin 2.4's floor is iOS 15.0, see AGENTS.md constraint 1
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: 猪满仓
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # ⚠️ Must be present, otherwise the first Face ID call crashes outright (AGENTS.md constraint 7).
        # App lock isn't built yet, but this line is put in place now.
        NSFaceIDUsageDescription: 使用面容 ID 解锁猪满仓，保护你的资产数据
        # ⚠️⚠️ Compose Multiplatform **strictly requires** this, otherwise the app crashes on launch:
        # `PlistSanityCheck` inside `ComposeUIViewController` throws an IllegalStateException.
        # It means that without this key, ProMotion devices get capped at 60Hz.
        #
        # This crash is extremely hard to track down: the exception happens on a dispatch queue, so
        # **there's no crash report, and nothing in the system log** — only
        # `xcrun simctl launch --console` can see it. And all iOS unit tests still pass —
        # they never create a ComposeUIViewController.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boomsset
        # Icon lives in iosApp/Assets.xcassets, generated by tools/appicon/generate.py
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # arm64 only — iosX64 has been removed, see AGENTS.md constraint 1
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: true
        # Gradle puts the framework here, split into subdirectories by configuration and SDK
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # ⚠️ The system sqlite3 must be linked explicitly, otherwise linking fails with undefined
        # symbols like `_sqlite3_step`. SQLDelight's native driver goes through SQLiter, whose
        # cinterop only declares that it needs sqlite3 — it doesn't link it on the consumer's behalf.
        #
        # Easy to misjudge here: **iOS unit tests do pass** — Kotlin/Native inherits cinterop's
        # linker opts when it links the test executable itself. But once the static framework is
        # handed to Xcode, those opts don't carry over to the app's link command line. So "all iOS
        # tests green" doesn't mean the app can link.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lsqlite3
        # No signing needed to run locally on the simulator
        CODE_SIGNING_ALLOWED: false
        CODE_SIGN_IDENTITY: ""
    dependencies:
      # Static framework, built first by the Run Script below
      - framework: SharedKit.framework
        embed: false
        link: true
    preBuildScripts:
      - name: Build shared framework
        # embedAndSignAppleFrameworkForXcode reads the environment variables Xcode injects
        # (CONFIGURATION / SDK_NAME / ARCHS) to decide which target to compile
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        # UI tests don't need signing either (run on the simulator)
        CODE_SIGNING_ALLOWED: false
        CODE_SIGN_IDENTITY: ""
        TEST_TARGET_NAME: iosApp

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests
